[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urine-culture-calibration-supplementary"
version = "0.1.0"
description = "Reproducible retrospective analyses for selective urine-culture screening"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib", "Pillow"]

[tool.setuptools.packages.find]
include = ["urineculture*"]
